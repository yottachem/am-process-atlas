[project]
name = "am-process-atlas"
version = "0.1.0"
description = "When to use each additive manufacturing process, with sourced vendor, materials and industry data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6",
    "jinja2>=3.1.6",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
