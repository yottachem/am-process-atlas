# Events-feed watch registry. Seeded 2026-11-11: the vendors in vendors.yaml with regular news flow, plus companies
# that left the market but appear in events (desktop-metal, nexa3d, sintratec).
# A key that is a vendors.yaml id takes its name and processes from there; any other key needs name and processes.
# ownership: public | private | subsidiary (own brand, owned by a parent) | defunct (operations ended)
# domain / other_domains: the company's own sites; links on them count as tier-1 sources (source_tiers.yaml).
# cik: SEC registrant for filings (ingest.filings). Only companies whose filings describe the AM business: HP is
#   left out (its filings cover the whole parent).
# news.terms: exact phrases (any match); news.context: words one of which must also appear (ambiguous names);
#   news.exclude: phrases that rule a headline out (other companies with the same name).
# newsroom_feed: the company's own RSS/Atom feed, checked 2026-11-11; null = none found.
# Listing here is not endorsement; the registry decides what is watched, not what is shown.

companies:
  3d-systems:
    ownership: public
    domain: 3dsystems.com
    other_domains: []
    cik: 910638
    news: {terms: ['"3D Systems"']}
    newsroom_feed: null
