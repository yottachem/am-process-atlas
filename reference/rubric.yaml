# Rating rubric. Every rating is relative to the whole field of additive processes, higher is better for the buyer.
# Dimensions with derived_from are computed from that band (atlas.load), so a rating can never disagree with its band;
# processes.yaml does not store them. The rest are editorial judgments against these anchors, supported by the refs.
dimensions:
  detail:
    label: Fine detail
    derived_from: min_feature
    levels: {1: "Features over 1 mm", 2: "0.2–1 mm features", 3: "50–200 µm features", 4: "10–50 µm features", 5: "Under 10 µm features"}
  surface:
    label: Surface finish
    levels: {1: "Rough; needs machining for any mating surface", 2: "Grainy or ridged; bead blast or vapor smooth for appearance", 3: "Fair; light sanding for appearance parts", 4: "Smooth on most faces; support marks only", 5: "Near-molded or optical as printed"}
  strength:
    label: Strength and isotropy
    levels: {1: "Display or mold use only", 2: "Light duty; strong direction dependence", 3: "Functional prototypes; moderate direction dependence", 4: "End-use parts; near-isotropic", 5: "Matches or beats wrought or molded parts in its class"}
  throughput:
    label: Throughput
    levels: {1: "Single parts, hours to days each", 2: "A few parts per build", 3: "Small batches per day", 4: "Hundreds of small parts per build", 5: "Production volume per machine"}
  size:
    label: Part size
    derived_from: max_part
    levels: {1: "Under 100 mm", 2: "100–300 mm", 3: "300 mm–1 m", 4: "1–3 m", 5: "Over 3 m"}
  materials:
    label: Material range
    levels: {1: "One material or a few grades", 2: "A small family", 3: "Several families", 4: "Broad catalog incl. engineering grades", 5: "Open, very broad catalog"}
  cost_per_part:
    label: Low cost per part
    levels: {1: "Highest cost per part in AM", 2: "High", 3: "Moderate", 4: "Low", 5: "Lowest in AM at volume"}
  system_cost:
    label: Low system cost
    derived_from: system_price
    levels: {1: "Over $500K, or service only", 2: "$100K–500K", 3: "$10K–100K", 4: "$1K–10K", 5: "Under $1K"}
  workflow:
    label: Easy workflow
    levels: {1: "Furnace, HIP, machining, or powder-handling facility needed", 2: "Several dedicated post steps", 3: "Wash and cure or depowder and blast", 4: "Light support removal", 5: "Print and use"}
  freedom:
    label: Design freedom
    levels: {1: "Strict overhang and support limits", 2: "Supports on most overhangs", 3: "Supports needed but removable", 4: "Soluble or minimal supports", 5: "No supports; nesting and enclosed features"}
