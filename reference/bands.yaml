# Bands replace point values: entry prices, feature sizes and part sizes vary by vendor, configuration and
# geometry, so the atlas shows the range a process typically falls in. Order matters (smallest first).
system_price:
  label: Entry system price (USD)
  note: Cheapest new system on sale that runs the process, before post-processing equipment. List price where
    published, otherwise a price reported by trade press or resellers. Quote-only systems are flagged as estimates.
  bands:
    - {id: lt1k, label: "Under $1K"}
    - {id: 1k-10k, label: "$1K–10K"}
    - {id: 10k-100k, label: "$10K–100K"}
    - {id: 100k-500k, label: "$100K–500K"}
    - {id: gt500k, label: "Over $500K"}
    - {id: service, label: "Service only", unranked: true}
min_feature:
  label: Smallest typical feature
  note: Smallest reliable wall or detail from a vendor or service-bureau design guide. Where only pixel, spot,
    or optical resolution is published, the band is set at twice that value.
  bands:
    - {id: lt10um, label: "Under 10 µm"}
    - {id: 10-50um, label: "10–50 µm"}
    - {id: 50-200um, label: "50–200 µm"}
    - {id: 0.2-1mm, label: "0.2–1 mm"}
    - {id: gt1mm, label: "Over 1 mm"}
max_part:
  label: Largest part, one dimension
  note: Longest build-envelope dimension on the largest commercial system for the process. A value on a band
    edge goes in the lower band.
  bands:
    - {id: lt100mm, label: "Under 100 mm"}
    - {id: 100-300mm, label: "100–300 mm"}
    - {id: 300mm-1m, label: "300 mm–1 m"}
    - {id: 1-3m, label: "1–3 m"}
    - {id: gt3m, label: "Over 3 m"}
