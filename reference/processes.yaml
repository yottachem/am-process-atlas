    modes on many printers'
  bands:
    system_price: lt1k
    min_feature: 50-200um
    max_part: 300mm-1m
  ratings:
    surface: 4
    strength: 3
    throughput: 3
    materials: 4
    cost_per_part: 4
    workflow: 3
    freedom: 3
  choose: Highest detail per dollar. Whole-layer exposure means time depends on height, not part count. Dental, jewelry,
    miniatures, small precise parts.
  avoid: Parts larger than about 350 mm; sustained mechanical load; temperatures above the resin HDT.
  applications: Dental models and splints, prototypes, jigs, jewelry, miniatures, microfluidics.
  vendors_text: Anycubic, Elegoo, Formlabs, HeyGears, Phrozen, Prusa (SL1S), UniFormation.
