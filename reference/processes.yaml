# Additive processes. One entry per process; ratings follow reference/rubric.yaml (detail, size and system_cost
# are derived from bands, so they are not stored here). Bands are defined in reference/bands.yaml.
# refs: each lists which fields it supports. verify lists open questions from the sourcing pass, one per line as
# "field: reason"; estimated names bands with no published figure (shown as "estimate"); band_notes add
# context shown under a band; LAUNCH_GATE=1 pytest fails while any remain or any process has no refs.
processes:
- id: sla
  name: Laser SLA
  aka: Stereolithography, galvo laser
  family: vpp
  maturity: mature
  materials:
  - polymer
  - elastomer
  - casting
  capabilities:
  - biocompatible
  - flame_retardant
  - transparent
  material_text: 'Photopolymer resins: standard, tough, flexible, castable, clear, biocompatible, high-temp, ceramic-filled'
  bands:
    system_price: 1k-10k
    min_feature: 50-200um
    max_part: 1-3m
  band_notes:
    system_price: Set by the Form 3+, which is being phased out and sold from remaining stock and reconditioned units.
      Laser SLA is two markets, desktop and industrial frame; the industrial systems cost far more.
  ratings:
    surface: 5
    strength: 3
    throughput: 2
    materials: 4
    cost_per_part: 3
    workflow: 3
    freedom: 3
  choose: Smooth, accurate prototypes and masters; large single resin parts on industrial frames; clear and optical parts;
    investment-casting patterns.
  avoid: Outdoor or UV-exposed end use, high-impact loads, high per-machine production volume.
  applications: Fit and form prototypes, QuickCast patterns, microfluidic chips, wind-tunnel models.
  vendors_text: 3D Systems (ProX 800, ProX 950, SLA 750), Formlabs (Form 3+, Form 3L), Stratasys (Neo), UnionTech.
  refs:
  - title: Additive Manufacturing Technologies, 3rd ed., chapter 'Vat Photopolymerization'
    url: https://link.springer.com/book/10.1007/978-3-030-56127-7
    publisher: Springer (Gibson, Rosen, Stucker, Khorasani)
    supports:
    - process
    year: 2021
  - title: How to design for 3D printed parts on the Form 3
    url: https://formlabs.com/blog/design-guide-form3/
    publisher: Formlabs
    supports:
    - min_feature
    note: 0.1 mm embossed detail, 0.2 mm supported wall
  - title: ProX 950 SLA printer
    url: https://www.3dsystems.com/3d-printers/prox-950
    publisher: 3D Systems
    supports:
    - max_part
    note: 1500 mm longest axis
  - title: Formlabs Form 3+ review
    url: https://www.tomsguide.com/reviews/formlabs-form-3-plus-3d-printer
    publisher: Tom's Guide
    supports:
    - system_price
    note: Reported $3,499, later $3,750
  - title: 'The Form 4 printer upgrade: Formlabs discontinue Form 3'
    url: https://www.additive-x.com/blog/the-form-4-printer-upgrade-formlabs-discontinue-form-3
    publisher: Additive-X (reseller)
    supports:
    - system_price
    note: Form 3+ being phased out
  - &id001
    title: Flame Retardant Resin
    url: https://formlabs.com/products/flame-retardant-resin/
    publisher: Formlabs
    supports:
    - capabilities
    note: UL 94 V-0 at 3 mm; runs on laser SLA (Form 3) and MSLA (Form 4) systems
  verify: []
- id: msla
  name: Masked SLA / LCD
  aka: MSLA, LCD, LFD (low force display)
